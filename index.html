<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini AI Chat</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --user-msg: #2563eb;
      --bot-msg: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .key-form {
      display: flex;
      gap: 0.5rem;
      flex-grow: 1;
      max-width: 520px;
    }

    input, select, textarea, button {
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    input[type="password"] {
      flex: 1;
    }

    button {
      background: var(--accent);
      color: #0b1120;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-msg);
      border-bottom-left-radius: 2px;
    }

    .message.status {
      align-self: center;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    #input-container {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 0.8rem;
    }

    #user-prompt {
      flex: 1;
      resize: none;
      height: 52px;
    }

    #status-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      background: #7f1d1d;
      color: #fca5a5;
    }

    #status-badge.active {
      background: #064e3b;
      color: #6ee7b7;
    }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:0.6rem;">
      <h2>Gemini Client</h2>
      <span id="status-badge">Key Missing</span>
    </div>

    <div class="key-form">
      <select id="model-select">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
      </select>
      <input type="password" id="api-key" placeholder="Enter Gemini API Key (AIzaSy...)" />
      <button id="save-key-btn">Save Key</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="message status">Enter your API key above to start prompting.</div>
  </div>

  <div id="input-container">
    <textarea id="user-prompt" placeholder="Type your prompt here... (Press Shift+Enter for new line)"></textarea>
    <button id="send-btn" disabled>Send</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const apiKeyInput = document.getElementById('api-key');
    const saveKeyBtn = document.getElementById('save-key-btn');
    const modelSelect = document.getElementById('model-select');
    const userPrompt = document.getElementById('user-prompt');
    const sendBtn = document.getElementById('send-btn');
    const statusBadge = document.getElementById('status-badge');

    let chatHistory = [];

    // Load key from sessionStorage if present
    const savedKey = sessionStorage.getItem('gemini_api_key');
    if (savedKey) {
      apiKeyInput.value = savedKey;
      setReadyState(true);
    }

    saveKeyBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert('Please enter a valid API key.');
        return;
      }
      sessionStorage.setItem('gemini_api_key', key);
      setReadyState(true);
    });

    function setReadyState(isReady) {
      if (isReady) {
        statusBadge.textContent = 'Key Loaded';
        statusBadge.classList.add('active');
        sendBtn.disabled = false;
      } else {
        statusBadge.textContent = 'Key Missing';
        statusBadge.classList.remove('active');
        sendBtn.disabled = true;
      }
    }

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }

    async function sendPrompt() {
      const prompt = userPrompt.value.trim();
      const apiKey = sessionStorage.getItem('gemini_api_key') || apiKeyInput.value.trim();
      const model = modelSelect.value;

      if (!prompt || !apiKey) return;

      appendMessage(prompt, 'user');
      userPrompt.value = '';

      // Append user turn to conversation history
      chatHistory.push({
        role: "user",
        parts: [{ text: prompt }]
      });

      const loadingMsg = appendMessage("Thinking...", "status");
      sendBtn.disabled = true;

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: chatHistory })
        });

        const data = await response.json();
        chatContainer.removeChild(loadingMsg);

        if (!response.ok) {
          throw new Error(data.error?.message || `HTTP error ${response.status}`);
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";
        appendMessage(reply, 'bot');

        // Append model response to conversation history
        chatHistory.push({
          role: "model",
          parts: [{ text: reply }]
        });

      } catch (err) {
        if (loadingMsg.parentNode) chatContainer.removeChild(loadingMsg);
        appendMessage(`Error: ${err.message}`, 'status');
      } finally {
        sendBtn.disabled = false;
        userPrompt.focus();
      }
    }

    sendBtn.addEventListener('click', sendPrompt);

    userPrompt.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    });
  </script>
</body>
</html>
